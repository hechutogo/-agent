[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickparts-xlerobot-agent"
version = "0.1.0"
description = "Sensor-only RGB-D XLeRobot Agent in ManiSkill 3"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mani_skill==3.0.1", "sapien==3.0.3", "torch==2.14.0",
  "qwen-agent==0.0.34", "openai==3.16.2", "python-dotenv==1.2.3",
  "soundfile==0.14.0", "scipy==1.17.1", "numpy==2.4.6",
  "opencv-python==5.0.0.93", "pin==4.1.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
microphone = ["sounddevice>=0.5,<1"]

[project.scripts]
pickparts = "pickparts_agent.interfaces.cli:main"
pickparts-web = "pickparts_agent.interfaces.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pickparts_agent.scene" = ["robots/assets/**/*"]
"pickparts_agent.interfaces" = ["static/*"]

[tool.setuptools.exclude-package-data]
"pickparts_agent.scene" = ["robots/assets/xlerobot/meshes/*.convex.stl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
